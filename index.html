                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain); gain.connect(audioCtx.destination);

            } catch (e) {

        function updateKeyboardHighlight() {
            document.querySelectorAll('.key').forEach(k => k.classList.remove('active', 'pressed', 'error'));
            
            if (!state.isPlaying || state.currentIndex >= state.textToType.length) {
                dom.fingerText.innerText = "ລໍຖ້າ...";
                dom.fingerColor.className = "w-3 h-3 rounded-full bg-gray-600";
                return;
            }
            
            const nextChar = state.textToType[state.currentIndex];
            const keyInfo = charMap[nextChar];

            if (keyInfo) {
                const targetKey = document.getElementById(keyInfo.code);
                if (targetKey) targetKey.classList.add('active');

                // Handle Shift requirement (Opposite hand shift rule)
                if (keyInfo.shift) {
                    const shiftId = keyInfo.side === 'right' ? 'ShiftLeft' : 'ShiftRight';
                    const shiftKey = document.getElementById(shiftId);
                    if (shiftKey) shiftKey.classList.add('active');
                }

                // Update Finger Guidance UI
                const fingerLao = fingerNamesLao[keyInfo.finger];
                const hand = keyInfo.side === 'left' ? 'ມືຊ້າຍ' : 'ມືຂວາ';
                dom.fingerText.innerHTML = `ໃຊ້ <b>${fingerLao}</b> (${hand}) ${keyInfo.shift ? ' + ກົດ Shift ພ້ອມກັນ' : ''}`;
                dom.fingerColor.className = `w-3 h-3 rounded-full shadow-[0_0_8px_currentColor] ${fingerColors[keyInfo.finger]}`;
            }
        }

        function triggerKeyPress(code, isError) {
            const keyEl = document.getElementById(code);
            if (keyEl) {
                keyEl.classList.add(isError ? 'error' : 'pressed');
                setTimeout(() => {
                    keyEl.classList.remove('pressed', 'error');
                    updateKeyboardHighlight(); 
                }, 150);
            }
        }

        function startGame() {
            state.lang = dom.langSelect.value;
            state.level = parseInt(dom.levelSelect.value);
            state.textToType = getRandomText(state.lang, state.level);
            state.currentIndex = 0; state.errors = 0; state.comboCount = 0; state.comboMultiplier = 1;
            state.startTime = null; state.isPlaying = true;
            
            dom.overlay.classList.add('hidden');
            dom.uiWpm.innerText = '0';
            updateComboUI();
            updateDisplay();
            window.focus();
        }

        function updateComboUI() {
            if (state.comboCount >= 20) state.comboMultiplier = 3;
            else if (state.comboCount >= 10) state.comboMultiplier = 2;
            else state.comboMultiplier = 1;

            dom.uiCombo.innerText = `x${state.comboMultiplier}`;
            if (state.comboMultiplier > 1) {
                dom.uiCombo.classList.add('combo-fire', 'text-2xl');
                dom.uiCombo.classList.remove('text-gray-500');
            } else {
                dom.uiCombo.classList.remove('combo-fire', 'text-2xl');
                dom.uiCombo.classList.add('text-gray-500');
            }
        }

        function calculateStats() {
            const timeElapsed = (new Date() - state.startTime) / 1000 / 60; 
            const totalChars = state.currentIndex;
            const wpm = Math.round((totalChars / 5) / (timeElapsed || 0.01)) || 0;
            const accuracy = Math.round(((totalChars - state.errors) / totalChars) * 100) || 100;
            return { wpm, accuracy };
        }

        function endGame() {
            state.isPlaying = false;
            const stats = calculateStats();
            playSuccessChime();
            
            let baseXP = Math.round(stats.wpm * (state.level + 1) * (stats.accuracy / 100));
            let finalXP = Math.max(5, baseXP * state.comboMultiplier); // Apply Combo Multiplier
            
            state.xp += finalXP;
            
            // Level Up (Every 200 XP = 1 Level)
            let newLevel = Math.floor(state.xp / 200) + 1;
            if (newLevel > state.userLevel) {
                state.userLevel = newLevel;
            }

            saveData();
            
            dom.resWpm.innerText = stats.wpm;
            dom.resAcc.innerText = stats.accuracy;
            dom.resXp.innerText = finalXP;
            dom.uiXp.innerText = state.xp;
            dom.uiLevel.innerText = state.userLevel;
            
            dom.overlay.classList.remove('hidden');
        }

        // Event Listeners
        dom.btnStart.addEventListener('click', startGame);
        dom.btnRetry.addEventListener('click', startGame);
        dom.btnReset.addEventListener('click', () => {
            if(confirm("ຕ້ອງການລຶບຄະແນນ XP ທັງໝົດເລີ່ມໃໝ່ແທ້ບໍ່?")) {
                localStorage.removeItem('typingMasterPro');
                state.xp = 0; state.userLevel = 1;
                dom.uiXp.innerText = '0'; dom.uiLevel.innerText = '1';
            }
        });
        dom.btnNext.addEventListener('click', () => {
            if (state.level < 3) dom.levelSelect.value = state.level + 1;
            startGame();
        });

        window.addEventListener('keydown', (e) => {
            if (!state.isPlaying) return;
            if (['Shift', 'Control', 'Alt', 'Meta', 'CapsLock', 'Tab'].includes(e.key)) return;
            
            // ປ້ອງກັນບໍ່ໃຫ້ໜ້າເວັບເລື່ອນເວລາກົດ Spacebar ແລະ ບໍ່ໃຫ້ Backspace ກັບໜ້າຫຼັງ
            if (e.key === ' ' || e.key === 'Backspace') e.preventDefault(); 
            
            if (!state.startTime) state.startTime = new Date();

            let inputKey = e.key;
            // ປ້ອງກັນການພິມຕົວດຽວແຕ່ໄດ້ 2 ຕົວ (ເຊັ່ນ ຫຼ) 
            let expectedSubstring = state.textToType.substring(state.currentIndex, state.currentIndex + inputKey.length);
            
            const expectedChar = state.textToType[state.currentIndex];
            const expectedKeyInfo = charMap[expectedChar];
            
            let physicalCode = expectedKeyInfo ? expectedKeyInfo.code : 'Space';

            if (inputKey === expectedSubstring) {
                triggerKeyPress(physicalCode, false);
                state.currentIndex += inputKey.length;
                state.comboCount++; // Increase Combo
                updateComboUI();
                updateDisplay();
                
                dom.uiWpm.innerText = calculateStats().wpm;

                if (state.currentIndex >= state.textToType.length) endGame();
            } else {
                // Determine wrong key code just for visual feedback
                let wrongCode = charMap[inputKey] ? charMap[inputKey].code : physicalCode;
                triggerKeyPress(wrongCode, true); 
                
                state.errors++;
                state.comboCount = 0; // Reset Combo on Error
                updateComboUI();
                playErrorBeep();
                
                const displayArea = document.getElementById('typing-display');
                displayArea.classList.add('text-red-500');
                setTimeout(() => displayArea.classList.remove('text-red-500'), 200);
            }
        });

        // Init
        loadData();
        renderKeyboard();
    </script>
</body>
</html>
