        .finger-index { border-bottom-color: #10b981; }
        .finger-thumb { border-bottom-color: #8b5cf6; }

        .key.active {
            transform: translateY(2px);
            border-bottom-width: 2px;

            resAcc: document.getElementById('res-acc'),
            resXp: document.getElementById('res-xp'),
            btnNext: document.getElementById('btn-next'),
            btnRetry: document.getElementById('btn-retry'),
            keyboardContainer: document.getElementById('keyboard-container'),
            fingerColor: document.getElementById('finger-indicator-color'),
            fingerText: document.getElementById('finger-indicator-text')
        };

        // Build character to key mapping
        const charMap = {};
        keyboardLayoutData.forEach(row => {
            row.forEach(key => {
                const [code, en, enS, la, laS, finger] = key;
                if (en) charMap[en] = { code, shift: false, finger };
                if (enS) charMap[enS] = { code, shift: true, finger };
                if (la) charMap[la] = { code, shift: false, finger };
                if (laS) charMap[laS] = { code, shift: true, finger };
            });
        });
        charMap[' '] = { code: 'Space', shift: false, finger: 'thumb' };

        // Lao compound character patterns (ສະຫຼະປະສົມ)
        // ຮອງຮັບການພິມທີ່ຫຼາກຫຼາຍ
        const laoPatterns = {
            // ສະຫຼະປະສົມທີ່ຕ້ອງການກົດຫຼາຍຄັ້ງ
            'ເຂົ້າ': { chars: ['ເ', 'ຂ', 'ົ', '້', 'າ'], display: 'ເຂົ້າ' },
            'ນ້ຳ': { chars: ['ນ', '້', 'ຳ'], display: 'ນ້ຳ' },
            'ນັ້ນ': { chars: ['ນ', 'ັ', '້', 'ນ'], display: 'ນັ້ນ' },
            'ຫຼ': { chars: ['ຫ', 'ຼ'], display: 'ຫຼ' },
            'ຫຼວງ': { chars: ['ຫ', 'ຼ', 'ວ', 'ງ'], display: 'ຫຼວງ' },
            'ໜ': { chars: ['ໜ'], display: 'ໜ' },
            'ໝ': { chars: ['ໝ'], display: 'ໝ' },
            'ເຫຼົ້າ': { chars: ['ເ', 'ຫ', 'ຼ', 'ົ້', 'າ'], display: 'ເຫຼົ້າ' },
            'ເຮົາ': { chars: ['ເ', 'ຮ', 'ົ', 'າ'], display: 'ເຮົາ' },
            'ເຂົາ': { chars: ['ເ', 'ຂ', 'ົ', 'າ'], display: 'ເຂົາ' },
            'ເຈົ້າ': { chars: ['ເ', 'ຈ', 'ົ້', 'າ'], display: 'ເຈົ້າ' },
            'ຜູ້': { chars: ['ຜ', 'ູ້'], display: 'ຜູ້' },
            'ຄວາຍ': { chars: ['ຄ', 'ວ', 'າ', 'ຍ'], display: 'ຄວາຍ' },
            'ງົວ': { chars: ['ງ', 'ົ', 'ວ'], display: 'ງົວ' },
            'ລົມ': { chars: ['ລ', 'ົ', 'ມ'], display: 'ລົມ' },
            'ໄຟ': { chars: ['ໄ', 'ຟ'], display: 'ໄຟ' },
            'ນ້ອງ': { chars: ['ນ', '້', 'ອ', 'ງ'], display: 'ນ້ອງ' },
            'ເມືອງ': { chars: ['ເ', 'ມ', 'ື', 'ອ', 'ງ'], display: 'ເມືອງ' },
            'ເຮືອນ': { chars: ['ເ', 'ຮ', 'ື', 'ອ', 'ນ'], display: 'ເຮືອນ' },
            'ບ້ານ': { chars: ['ບ', '້', 'າ', 'ນ'], display: 'ບ້ານ' },
            'ໂຮງ': { chars: ['ໂ', 'ຮ', 'ງ'], display: 'ໂຮງ' },
            'ຮຽນ': { chars: ['ຮ', 'ຽ', 'ນ'], display: 'ຮຽນ' },
            'ຂຽນ': { chars: ['ຂ', 'ຽ', 'ນ'], display: 'ຂຽນ' },
            'ອ່ານ': { chars: ['ອ', '່', 'າ', 'ນ'], display: 'ອ່ານ' },
            'ຫຼິ້ນ': { chars: ['ຫ', 'ຼ', 'ິ້', 'ນ'], display: 'ຫຼິ້ນ' },
            'ສະ': { chars: ['ສ', 'ະ'], display: 'ສະ' },
            'ບາຍ': { chars: ['ບ', 'າ', 'ຍ'], display: 'ບາຍ' },
            'ດີ': { chars: ['ດ', 'ີ'], display: 'ດີ' },
            'ລາວ': { chars: ['ລ', 'າ', 'ວ'], display: 'ລາວ' },
            'ນົກ': { chars: ['ນ', 'ົ', 'ກ'], display: 'ນົກ' },
            'ໜູ': { chars: ['ໜ', 'ູ'], display: 'ໜູ' },
            'ປາ': { chars: ['ປ', 'າ'], display: 'ປາ' },
            'ໝາ': { chars: ['ໝ', 'າ'], display: 'ໝາ' },
            'ເປັດ': { chars: ['ເ', 'ປ', 'ັ', 'ດ'], display: 'ເປັດ' },
            'ໄກ່': { chars: ['ໄ', 'ກ', '່'], display: 'ໄກ່' },
            'ຊ້າງ': { chars: ['ຊ', '້', 'າ', 'ງ'], display: 'ຊ້າງ' },
            'ມ້າ': { chars: ['ມ', '້', 'າ'], display: 'ມ້າ' },
            'ດິນ': { chars: ['ດ', 'ິ', 'ນ'], display: 'ດິນ' },
            'ຕະຫຼາດ': { chars: ['ຕ', 'ະ', 'ຫ', 'ຼ', 'າ', 'ດ'], display: 'ຕະຫຼາດ' }
        };

        // Build reverse lookup for patterns
        const patternLookup = {};
        Object.keys(laoPatterns).forEach(key => {
            const pattern = laoPatterns[key];
            // ສ້າງ lookup ຈາກຕົວອັກສອນທຳອິດ
            const firstChar = pattern.chars[0];
            if (!patternLookup[firstChar]) patternLookup[firstChar] = [];
            patternLookup[firstChar].push(key);
        });

        const fingerNamesLao = { pinky: "ນິ້ວກ້ອຍ", ring: "ນິ້ວນາງ", middle: "ນິ້ວກາງ", index: "ນິ້ວຊີ້", thumb: "ນິ້ວໂປ້" };
        const fingerColors = { pinky: "bg-pink-500", ring: "bg-blue-500", middle: "bg-yellow-500", index: "bg-emerald-500", thumb: "bg-purple-500" };

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration, vol) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.warn("Audio error:", e);
            }
        }
        function playErrorBeep() { playTone(150, 'sawtooth', 0.2, 0.1); }
        function playSuccessChime() { 
            playTone(600, 'sine', 0.1, 0.1); 
            setTimeout(() => playTone(1200, 'sine', 0.4, 0.1), 100);
        }

        function loadData() {
            const saved = localStorage.getItem('typingMasterPro');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    state.xp = data.xp || 0;
                    state.userLevel = data.userLevel || 1;
                    dom.uiXp.innerText = state.xp;
                    dom.uiLevel.innerText = state.userLevel;
                } catch(e) {}
            }
        }

        function saveData() {
            localStorage.setItem('typingMasterPro', JSON.stringify({ xp: state.xp, userLevel: state.userLevel }));
        }

        function getRandomText(lang, levelIndex) {
            const arr = typingData[lang] && typingData[lang][levelIndex];
            if (!arr || arr.length === 0) return "ສະບາຍດີ";
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function renderKeyboard() {
            const container = dom.keyboardContainer;
            container.innerHTML = '';
            
            keyboardLayoutData.forEach((row) => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'keyboard-row';
                
                row.forEach(keyInfo => {
                    const [code, en, enS, la, laS, finger, extClass] = keyInfo;
                    const keyDiv = document.createElement('div');
                    let className = `key finger-${finger}`;
                    if (extClass) className += ` ${extClass}`;
                    keyDiv.className = className;
                    keyDiv.id = code;
                    
                    if (code === 'Space') {
                        keyDiv.innerHTML = `<span class="primary m-auto">Space</span>`;
                    } else if (code === 'Tab' || code === 'CapsLock' || code === 'ShiftLeft' || code === 'ShiftRight' || code === 'Enter' || code === 'Backspace') {
                        keyDiv.innerHTML = `<span class="primary m-auto">${en}</span>`;
                    } else {
                        const laDisplay = laS || la;
                        keyDiv.innerHTML = `
                            <span class="primary text-left text-[10px] sm:text-xs text-gray-300">${en}</span>
                            <span class="secondary text-right text-xs sm:text-sm text-white font-bold">${laDisplay}</span>
                        `;
                    }
                    rowDiv.appendChild(keyDiv);
                });
                container.appendChild(rowDiv);
            });
        }

        function updateDisplay() {
            let html = '';
            let i = 0;
            while (i < state.textToType.length) {
                const char = state.textToType[i];
                if (i < state.currentIndex) {
                    html += `<span class="text-emerald-400">${char === ' ' ? '<span class="opacity-40 font-mono">␣</span>' : char}</span>`;
                } else if (i === state.currentIndex) {
                    // ກວດສອບວ່າມີ pattern ທີ່ກົງກັນບໍ?
                    let patternFound = false;
                    let patternLength = 1;
                    
                    if (state.currentIndex + 1 < state.textToType.length) {
                        const remaining = state.textToType.substring(state.currentIndex);
                        for (let key of Object.keys(laoPatterns)) {
                            if (remaining.startsWith(key)) {
                                patternFound = true;
                                patternLength = key.length;
                                break;
                            }
                        }
                    }
                    
                    if (patternFound) {
                        const remaining = state.textToType.substring(state.currentIndex);
                        const matchedKey = Object.keys(laoPatterns).find(k => remaining.startsWith(k));
                        if (matchedKey) {
                            html += `<span class="text-white text-cursor rounded px-0.5 lao-char-highlight">${matchedKey}</span>`;
                            i += matchedKey.length - 1;
                        } else {
                            html += `<span class="text-white text-cursor rounded px-0.5">${char === ' ' ? '<span class="opacity-60 font-mono">␣</span>' : char}</span>`;
                        }
                    } else {
                        html += `<span class="text-white text-cursor rounded px-0.5">${char === ' ' ? '<span class="opacity-60 font-mono">␣</span>' : char}</span>`;
                    }
                } else {
                    html += `<span class="text-gray-500">${char === ' ' ? '<span class="opacity-20 font-mono">␣</span>' : char}</span>`;
                }
                i++;
            }
            dom.typingDisplay.innerHTML = html;
            updateKeyboardHighlight();
        }

        function updateKeyboardHighlight() {
            document.querySelectorAll('.key').forEach(k => k.classList.remove('active', 'pressed', 'error'));
            
            if (!state.isPlaying || state.currentIndex >= state.textToType.length) {
                dom.fingerText.innerText = "ລໍຖ້າ...";
                dom.fingerColor.className = "w-3 h-3 rounded-full bg-gray-600";
                return;
            }
            
            // ຊອກຫາ pattern ທີ່ກົງກັນ
            let charToHighlight = state.textToType[state.currentIndex];
            let isPattern = false;
            
            if (state.currentIndex + 1 < state.textToType.length) {
                const remaining = state.textToType.substring(state.currentIndex);
                for (let key of Object.keys(laoPatterns)) {
                    if (remaining.startsWith(key)) {
                        charToHighlight = key;
                        isPattern = true;
                        break;
                    }
                }
            }
            
            // ຖ້າເປັນ pattern, ເອົາຕົວອັກສອນທຳອິດ
            let firstChar = isPattern ? charToHighlight[0] : charToHighlight;
            let keyInfo = charMap[firstChar];
            
            if (keyInfo) {
                const targetKey = document.getElementById(keyInfo.code);
                if (targetKey) targetKey.classList.add('active');

                if (keyInfo.shift) {
                    const shiftKeys = ['ShiftLeft', 'ShiftRight'];
                    shiftKeys.forEach(id => {
                        const shiftKey = document.getElementById(id);
                        if (shiftKey) shiftKey.classList.add('active');
                    });
                }

                const fingerLao = fingerNamesLao[keyInfo.finger] || "ນິ້ວ";
                let displayText = `ໃຊ້ <b>${fingerLao}</b>`;
                if (keyInfo.shift) displayText += ' + ກົດ Shift ພ້ອມກັນ';
                if (isPattern) {
                    displayText += ` (ພິມ: ${charToHighlight})`;
                }
                dom.fingerText.innerHTML = displayText;
                dom.fingerColor.className = `w-3 h-3 rounded-full shadow-[0_0_8px_currentColor] ${fingerColors[keyInfo.finger]}`;
            }
        }

        function triggerKeyPress(code, isError) {
            const keyEl = document.getElementById(code);
            if (keyEl) {
                keyEl.classList.add(isError ? 'error' : 'pressed');
                setTimeout(() => {
                    keyEl.classList.remove('pressed', 'error');
                    updateKeyboardHighlight(); 
                }, 150);
            }
        }

        function startGame() {
            state.lang = dom.langSelect.value;
            state.level = parseInt(dom.levelSelect.value);
            state.textToType = getRandomText(state.lang, state.level);
            state.currentIndex = 0;
            state.errors = 0;
            state.comboCount = 0;
            state.comboMultiplier = 1;
            state.startTime = null;
            state.isPlaying = true;
            state.pendingChars = [];
            
            dom.overlay.classList.add('hidden');
            dom.uiWpm.innerText = '0';
            updateComboUI();
            updateDisplay();
            window.focus();
        }

        function updateComboUI() {
            if (state.comboCount >= 20) state.comboMultiplier = 3;
            else if (state.comboCount >= 10) state.comboMultiplier = 2;
            else state.comboMultiplier = 1;

            dom.uiCombo.innerText = `x${state.comboMultiplier}`;
            if (state.comboMultiplier > 1) {
                dom.uiCombo.classList.add('combo-fire', 'text-2xl');
                dom.uiCombo.classList.remove('text-gray-500');
            } else {
                dom.uiCombo.classList.remove('combo-fire', 'text-2xl');
                dom.uiCombo.classList.add('text-gray-500');
            }
        }

        function calculateStats() {
            const timeElapsed = (new Date() - state.startTime) / 1000 / 60; 
            const totalChars = state.currentIndex;
            const wpm = Math.round((totalChars / 5) / (timeElapsed || 0.01)) || 0;
            const accuracy = Math.round(((totalChars - state.errors) / totalChars) * 100) || 100;
            return { wpm, accuracy };
        }

        function endGame() {
            state.isPlaying = false;
            const stats = calculateStats();
            playSuccessChime();
            
            let baseXP = Math.round(stats.wpm * (state.level + 1) * (stats.accuracy / 100));
            let finalXP = Math.max(5, baseXP * state.comboMultiplier);
            
            state.xp += finalXP;
            
            let newLevel = Math.floor(state.xp / 200) + 1;
            if (newLevel > state.userLevel) {
                state.userLevel = newLevel;
            }

            saveData();
            
            dom.resWpm.innerText = stats.wpm;
            dom.resAcc.innerText = stats.accuracy;
            dom.resXp.innerText = finalXP;
            dom.uiXp.innerText = state.xp;
            dom.uiLevel.innerText = state.userLevel;
            
            dom.overlay.classList.remove('hidden');
        }

        // ກວດສອບວ່າການກົດເຂົ້າມາກົງກັບ pattern ຫຼືບໍ່
        function checkPatternMatch(inputChar, shiftPressed) {
            if (state.currentIndex >= state.textToType.length) return null;
            
            const remaining = state.textToType.substring(state.currentIndex);
            
            // ກວດສອບທຸກ pattern
            for (let key of Object.keys(laoPatterns)) {
                if (remaining.startsWith(key)) {
                    const pattern = laoPatterns[key];
                    // ກວດສອບຕົວອັກສອນທຳອິດ
                    const firstChar = pattern.chars[0];
                    const firstCharInfo = charMap[firstChar];
                    if (firstCharInfo) {
                        // ກວດສອບວ່າກົດຕົວອັກສອນນີ້ບໍ?
                        const inputInfo = charMap[inputChar];
                        if (inputInfo && inputInfo.code === firstCharInfo.code && inputInfo.shift === firstCharInfo.shift) {
                            return {
                                pattern: key,
                                chars: pattern.chars,
                                matched: true,
                                keyInfo: firstCharInfo
                            };
                        }
                    }
                }
            }
            return null;
        }

        // Event Listeners
        dom.btnStart.addEventListener('click', startGame);
        dom.btnRetry.addEventListener('click', startGame);
        dom.btnReset.addEventListener('click', () => {
            if(confirm("ຕ້ອງການລຶບຄະແນນ XP ທັງໝົດເລີ່ມໃໝ່ແທ້ບໍ່?")) {
                localStorage.removeItem('typingMasterPro');
                state.xp = 0;
                state.userLevel = 1;
                dom.uiXp.innerText = '0';
                dom.uiLevel.innerText = '1';
            }
        });
        dom.btnNext.addEventListener('click', () => {
            if (state.level < 3) dom.levelSelect.value = state.level + 1;
            startGame();
        });

        window.addEventListener('keydown', (e) => {
            if (!state.isPlaying) return;
            if (['Control', 'Alt', 'Meta', 'CapsLock', 'Tab'].includes(e.key)) return;
            if (e.key === 'Shift') return;
            
            if (e.key === ' ' || e.key === 'Backspace') e.preventDefault(); 
            
            if (!state.startTime) state.startTime = new Date();

            let inputKey = e.key;
            let shiftPressed = e.shiftKey;
            
            // ກວດສອບ pattern ກ່ອນ
            const patternResult = checkPatternMatch(inputKey, shiftPressed);
            
            if (patternResult) {
                // ກົດຖືກຕ້ອງ
                triggerKeyPress(patternResult.keyInfo.code, false);
                
                // ຂ້າມຕົວອັກສອນທັງໝົດໃນ pattern
                const patternLength = patternResult.chars.length;
                // ຖ້າ pattern ມີຫຼາຍກວ່າ 1 ຕົວ, ຂ້າມໄປທັງໝົດ
                if (patternLength > 1) {
                    // ກວດສອບວ່າຕົວອັກສອນທີ່ເຫຼືອກົງກັນບໍ?
                    // ຖ້າກົງ, ຂ້າມໄປທັງໝົດ
                    state.currentIndex += patternLength;
                } else {
                    state.currentIndex += 1;
                }
                
                state.comboCount++;
                updateComboUI();
                updateDisplay();
                
                dom.uiWpm.innerText = calculateStats().wpm;

                if (state.currentIndex >= state.textToType.length) {
                    setTimeout(endGame, 300);
                }
            } else {
                // ກວດສອບຕົວອັກສອນດຽວ
                const expectedChar = state.textToType[state.currentIndex];
                const expectedInfo = charMap[expectedChar];
                const inputInfo = charMap[inputKey];
                
                let isMatch = false;
                let matchInfo = null;
                
                if (expectedInfo && inputInfo) {
                    if (expectedInfo.code === inputInfo.code && expectedInfo.shift === inputInfo.shift) {
                        isMatch = true;
                        matchInfo = inputInfo;
                    }
                }
                
                if (isMatch && matchInfo) {
                    triggerKeyPress(matchInfo.code, false);
                    state.currentIndex += 1;
                    state.comboCount++;
                    updateComboUI();
                    updateDisplay();
                    
                    dom.uiWpm.innerText = calculateStats().wpm;

                    if (state.currentIndex >= state.textToType.length) {
                        setTimeout(endGame, 300);
                    }
                } else {
                    // ກົດຜິດ
                    let wrongCode = 'Space';
                    if (inputInfo) {
                        wrongCode = inputInfo.code;
                    }
                    triggerKeyPress(wrongCode, true);
                    
                    state.errors++;
                    state.comboCount = 0;
                    updateComboUI();
                    playErrorBeep();
                    
                    const displayArea = document.getElementById('typing-display');
                    displayArea.classList.add('text-red-500');
                    setTimeout(() => displayArea.classList.remove('text-red-500'), 200);
                }
            }
        });

        // Init
        loadData();
        renderKeyboard();
    </script>
</body>
</html>
